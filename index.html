<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ネタトルくん</title>
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0E5A47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ネタトルくん">
<meta name="description" content="ネタトルくん — 貸切バス・旅行業界のニュースを全国と鹿児島県に分けてひとまとめに。15分ごとに自動更新。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@900&family=BIZ+UDPGothic:wght@400;700&family=Noto+Serif+JP:wght@600;800&display=swap">
<style>
/* Layout: newspaper masthead + region switch, main column of headlines, side rail of operational info */
:root{
  --bg:#F3F4F1; --paper:#FFFFFF; --ink:#16191D; --muted:#4A4F57; --rule:#DCDDD8;
  --accent:#0E5A47; --accent-ink:#FFFFFF; --new:#F2B705; --new-ink:#16191D; --alert:#B4410C; --bar:#16191D; --bar-ink:#E9EAE6;
  --c-acc:#C0262D; --c-bus:#0E5A47; --c-road:#7A5212; --c-gov:#B4410C; --c-travel:#5B3E8C; --c-inb:#1F4E8C; --c-stat:#4A4F57;
  --display:"Noto Serif JP","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121417; --paper:#1B1E22; --ink:#ECEDEA; --muted:#A9ADB3; --rule:#2E3238;
  --accent:#4FB596; --accent-ink:#0B1F19; --alert:#F08A55; --bar:#0B0C0E; --bar-ink:#C9CBC6;
  --c-acc:#C63A40; --c-bus:#1D7A62; --c-road:#8E6A22; --c-gov:#B4501C; --c-travel:#6E529E; --c-inb:#2F65AD; --c-stat:#5A606A;
  color-scheme:dark}}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.7}
[hidden]{display:none!important}
a{color:inherit;text-decoration:none}
a:hover{color:var(--accent);text-decoration:underline}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1200px;margin:0 auto;padding-inline:20px}
.topbar{background:var(--bar);color:var(--bar-ink);font-size:13px}
.topbar .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:6px 16px;padding-block:8px}
header.mast{background:var(--paper);border-bottom:3px solid var(--accent)}
header.mast .wrap{display:flex;flex-direction:column;gap:18px;padding-block:24px 0}
.mast-row{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px}
.eyebrow{font-size:13px;letter-spacing:.1em;color:var(--accent);font-weight:700}
.brand{display:flex;align-items:center;gap:14px}
.brand img{width:clamp(56px,11vw,72px);height:auto;flex:none}
.logo{margin:0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;line-height:1.1}
.logo .en{font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","BIZ UDPGothic",sans-serif;font-weight:900;font-size:clamp(36px,7vw,52px);letter-spacing:.02em;color:var(--ink);white-space:nowrap}
.logo .en i{font-style:normal;color:var(--accent)}
.logo .ja{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.2em;color:var(--muted);white-space:nowrap}
.status{font-size:13px;color:var(--muted);text-align:right;max-width:360px}
.status.err{color:var(--alert)}
.seg{display:flex;border:2px solid var(--ink);align-self:flex-start}
.seg button{min-height:46px;min-width:130px;padding:0 20px;border:0;background:var(--paper);color:var(--ink);font:700 16px var(--body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{position:relative;display:flex;align-items:center;max-width:520px;width:100%}
.search svg{position:absolute;left:12px;width:18px;height:18px;color:var(--muted);pointer-events:none}
.search input{width:100%;min-height:44px;padding:0 44px 0 40px;border:1px solid var(--rule);border-radius:999px;background:var(--bg);color:var(--ink);font:16px var(--body)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.search input::-webkit-search-cancel-button{display:none}
.search .clear{position:absolute;right:6px;width:34px;height:34px;border:0;border-radius:50%;background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
mark{background:var(--new);color:var(--new-ink);padding:0 1px;border-radius:2px}
.hint-btn{border:0;background:none;color:var(--accent);font:700 14px var(--body);text-decoration:underline;cursor:pointer;padding:4px 0}
nav.tabs{display:flex;flex-wrap:wrap;gap:2px}
nav.tabs button{min-height:44px;padding:0 14px;border:0;border-bottom:4px solid transparent;background:transparent;color:var(--muted);font:700 15px var(--body);cursor:pointer}
nav.tabs button[aria-pressed="true"]{color:var(--accent);border-bottom-color:var(--accent)}
main.wrap{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start;padding-block:28px 64px}
.col{flex:1 1 600px;min-width:0;display:flex;flex-direction:column;gap:28px}
aside{flex:1 1 300px;min-width:0;display:flex;flex-direction:column;gap:22px}
.tag{display:inline-block;color:#FFFFFF;padding:2px 8px;font-size:12px;font-weight:700}
.new{background:var(--new);color:var(--new-ink);padding:2px 7px;font-size:11px;font-weight:800;letter-spacing:.08em;border-radius:2px}
.upd{display:inline-flex;align-items:center;gap:8px}
.reload-wrap{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.reload{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--accent);color:var(--accent-ink);font:700 15px var(--body);cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.reload:hover{filter:brightness(1.1)}
.reload[disabled]{opacity:.5;cursor:default}
.reload svg{width:17px;height:17px}
.reload .spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.reload .spin{animation:none}}
.chk{border:1px solid var(--alert);color:var(--alert);padding:1px 7px;font-size:12px;font-weight:700}
.meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);align-items:center}
.list-head{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid var(--ink);padding-bottom:8px;gap:12px}
.list-head h2{margin:0;font-family:var(--display);font-size:20px;font-weight:800}
.item{padding:14px 0;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.item h3{margin:0;font-size:17px;font-weight:700;line-height:1.6;text-wrap:pretty}
.item.read h3{color:var(--muted);font-weight:400}
.item.read .meta{opacity:.6}
.read-mark{font-size:11px;font-weight:700;color:var(--muted);border:1px solid var(--rule);padding:1px 6px}
.col.swipe-l{animation:swipeL .22s ease-out}
.col.swipe-r{animation:swipeR .22s ease-out}
@keyframes swipeL{from{opacity:.3;transform:translateX(28px)}to{opacity:1;transform:none}}
@keyframes swipeR{from{opacity:.3;transform:translateX(-28px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){.col.swipe-l,.col.swipe-r{animation:none}}
.list-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.mini{min-height:32px;padding:0 12px;border:1px solid var(--rule);border-radius:999px;background:var(--paper);color:var(--ink);font:700 12px var(--body);cursor:pointer}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.unread-badge{display:inline-block;min-width:22px;margin-left:8px;padding:0 6px;border-radius:999px;background:var(--new);color:var(--new-ink);font-size:12px;line-height:20px;font-variant-numeric:tabular-nums}
.empty{padding:28px 0;color:var(--muted);font-size:14px}
.box{background:var(--paper);border:1px solid var(--rule);padding:20px;display:flex;flex-direction:column;gap:12px}
.box h2{margin:0;font-family:var(--display);font-size:18px;font-weight:800}
.box.alerts{border:2px solid var(--alert)}
.box.alerts h2{color:var(--alert)}
.alert-row{font-size:14px;line-height:1.7}
.src-row{display:flex;justify-content:space-between;gap:10px;font-size:13px}
.src-row .n{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.src-row .n.err{color:var(--alert)}
.note{font-size:12px;color:var(--muted)}
footer{background:var(--bar);color:var(--bar-ink);font-size:13px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;padding-block:22px}
@media (max-width:560px){.reload-wrap{align-items:flex-start}.status{text-align:left;max-width:none}.seg{width:100%}.seg button{flex:1;min-width:0}}
</style>
</head>
<body>
<div class="topbar"><div class="wrap">
  <span class="upd"><span id="updated">最終更新:—</span></span>
  <span>15分ごとに自動更新 ・ 見出しは各配信元へリンクします</span>
</div></div>

<header class="mast"><div class="wrap">
  <div class="mast-row">
    <div style="display:flex;flex-direction:column;gap:4px">
      <span class="eyebrow">貸切バス・旅行業界のニュースをひとまとめに</span>
      <div class="brand"><img src="icons/logo-mark.png" alt="" width="72" height="72"><h1 class="logo"><span class="en"><i>ネタ</i>トルくん</span><span class="ja">NETATORU-KUN</span></h1></div>
    </div>
    <div class="reload-wrap">
      <button id="reloadBtn" class="reload" type="button"><svg id="reloadIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg><span>最新に更新</span></button>
      <span id="status" class="status" role="status" aria-live="polite"></span>
    </div>
  </div>
  <div class="seg" role="group" aria-label="地域">
    <button type="button" data-region="national" aria-pressed="true">全国</button>
    <button type="button" data-region="kagoshima" aria-pressed="false">鹿児島県</button>
  </div>
  <form class="search" role="search" onsubmit="return false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="ニュースを検索(例:指宿 運転士 インバウンド)" aria-label="ニュースを検索" autocomplete="off">
    <button id="qClear" class="clear" type="button" aria-label="検索をクリア" hidden>×</button>
  </form>
  <nav class="tabs" id="tabs" aria-label="カテゴリ"></nav>
</div></header>

<main class="wrap">
  <div class="col">
    <section>
      <div class="list-head"><h2 id="listTitle">全国の最新ニュース</h2><div class="list-tools"><span id="count" class="note"></span><button id="unreadOnly" class="mini" type="button" aria-pressed="false">未読のみ</button><button id="markAll" class="mini" type="button">すべて既読にする</button></div></div>
      <div id="list"><p class="empty">ニュースを読み込んでいます…</p></div>
    </section>
  </div>
  <aside>
    <section class="box alerts" id="alerts" hidden>
      <h2>道路・運行・緊急情報</h2>
      <div id="alertList" style="display:flex;flex-direction:column;gap:8px"></div>
      <span class="note">直近3日間の通行止め・運休・緊急のお知らせを優先して表示します。</span>
    </section>
    <section class="box">
      <h2>集めている情報源</h2>
      <div id="sources" style="display:flex;flex-direction:column;gap:6px"></div>
      <span class="note">各配信元のRSS(新着情報の配信)から見出しとリンクを取得しています。</span>
    </section>
  </aside>
</main>

<footer><div class="wrap">
  <span>ネタトルくん ― 貸切バス・旅行業界ニュース</span>
  <span>見出しの著作権は各配信元に帰属します</span>
</div></footer>

<script>
(function(){
  var APP_VERSION = "2026-10-07-0015";
  var CAT_COLOR = {"事故":"--c-acc","貸切バス":"--c-bus","交通・道路":"--c-road","行政・制度":"--c-gov","旅行・観光":"--c-travel","インバウンド":"--c-inb","統計":"--c-stat"};
  var CAT_ORDER = ["事故","貸切バス","交通・道路","行政・制度","旅行・観光","インバウンド","統計"];
  var state = { region:"national", filter:"all", data:null, unreadOnly:false, q:"" };
  function terms(){ return state.q.trim().toLowerCase().split(/[\s\u3000]+/).filter(Boolean); }
  function matches(n, ts){ if(!ts.length) return true; var s=n.title.toLowerCase(); return ts.every(function(t){ return s.indexOf(t)>=0; }); }
  function highlight(text, ts){
    var frag=document.createDocumentFragment(); if(!ts.length){ frag.appendChild(document.createTextNode(text)); return frag; }
    var low=text.toLowerCase(), i=0;
    while(i<text.length){
      var best=-1, len=0;
      ts.forEach(function(t){ var p=low.indexOf(t,i); if(p>=0 && (best<0||p<best)){ best=p; len=t.length; } });
      if(best<0){ frag.appendChild(document.createTextNode(text.slice(i))); break; }
      if(best>i) frag.appendChild(document.createTextNode(text.slice(i,best)));
      var m=document.createElement("mark"); m.textContent=text.slice(best,best+len); frag.appendChild(m); i=best+len;
    }
    return frag;
  }
  var readMap = {};
  try { readMap = JSON.parse(localStorage.getItem("readLinks")||"{}") || {}; } catch(e){ readMap = {}; }
  function saveRead(){
    // keep only the newest 2000 entries
    var keys=Object.keys(readMap); if(keys.length>2000){ keys.sort(function(a,b){return readMap[a]-readMap[b];}).slice(0,keys.length-2000).forEach(function(k){ delete readMap[k]; }); }
    try { localStorage.setItem("readLinks", JSON.stringify(readMap)); } catch(e){}
  }
  function isRead(n){ return !!readMap[n.link]; }
  function markRead(url){ if(!url||readMap[url]) return; readMap[url]=Date.now(); saveRead(); render(); }
  try { var saved = localStorage.getItem("region"); if (saved==="kagoshima"||saved==="national") state.region = saved; } catch(e){}

  function $(id){ return document.getElementById(id); }
  function el(tag, cls, text){ var e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=String(text); return e; }
  function link(text, url){ if(!/^https?:\/\//.test(url||"")) return el("span",null,text); var a=el("a",null,text); a.href=url; a.target="_blank"; a.rel="noopener"; a.setAttribute("data-link",url); return a; }
  function tag(cat){ var t=el("span","tag",cat); t.style.background="var("+(CAT_COLOR[cat]||"--c-stat")+")"; return t; }
  // NEW = published within the last 24 hours, or picked up by the collector within the last 3 hours.
  var NEW_PUBLISHED_MS = 24*60*60*1000, NEW_SEEN_MS = 3*60*60*1000;
  function within(iso, ms){ if(!iso) return false; var t=new Date(iso).getTime(); return !isNaN(t) && Date.now()-t < ms; }
  function isNew(n){ return within(n.date, NEW_PUBLISHED_MS) || within(n.firstSeen, NEW_SEEN_MS); }
  function fmtDate(iso){ if(!iso) return ""; var d=new Date(iso); if(isNaN(d)) return "";
    return d.toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",year:"numeric",month:"numeric",day:"numeric"}); }
  function fmtTime(iso){ if(!iso) return "—"; var d=new Date(iso); if(isNaN(d)) return "—";
    return d.toLocaleString("ja-JP",{timeZone:"Asia/Tokyo",month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"}); }
  function ago(iso){ var m=Math.round((Date.now()-new Date(iso))/60000); if(m<1) return "たった今"; if(m<60) return m+"分前"; return Math.floor(m/60)+"時間前"; }

  function render(){
    var r=state.region, name = r==="national"?"全国":"鹿児島県";
    document.querySelectorAll(".seg button").forEach(function(b){
      b.setAttribute("aria-pressed", String(b.dataset.region===r));
      var its = state.data && state.data.regions ? state.data.regions[b.dataset.region].items : [];
      var u = its.filter(function(n){ return !isRead(n); }).length;
      b.textContent = b.dataset.region==="national" ? "全国" : "鹿児島県";
      if (u) { var s=el("span","unread-badge",u); s.setAttribute("aria-label","未読"+u+"件"); b.appendChild(s); }
    });
    var d=state.data, reg = d && d.regions ? d.regions[r] : null;
    $("updated").textContent = "最終更新:" + (d ? fmtTime(d.updatedAt)+"("+ago(d.updatedAt)+")" : "—");
    var items = reg ? reg.items : [];

    var tabs=$("tabs"); tabs.textContent="";
    var cats=["all"].concat(CAT_ORDER.filter(function(c){ return items.some(function(n){ return n.cat===c; }); }));
    if (cats.indexOf(state.filter)<0) state.filter="all";
    state.cats = cats;
    cats.forEach(function(c){ var b=el("button",null,c==="all"?"すべて":c); b.type="button"; b.setAttribute("aria-pressed",String(c===state.filter));
      b.onclick=function(){ state.filter=c; render(); }; tabs.appendChild(b); });

    var ts = terms();
    var inCat = items.filter(function(n){ return (state.filter==="all" || n.cat===state.filter) && matches(n, ts); });
    var unread = inCat.filter(function(n){ return !isRead(n); }).length;
    var shown = state.unreadOnly ? inCat.filter(function(n){ return !isRead(n); }) : inCat;
    $("unreadOnly").setAttribute("aria-pressed", String(state.unreadOnly));
    $("markAll").hidden = !unread;

    $("listTitle").textContent = ts.length ? "「"+state.q.trim()+"」の検索結果("+name+")" : (state.filter==="all" ? name+"の最新ニュース" : name+" ・ "+state.filter);
    $("qClear").hidden = !state.q;
    var rest = shown;
    $("count").textContent = inCat.length ? "未読"+unread+"件 / 全"+inCat.length+"件" : "";
    var list=$("list"); list.textContent="";
    if (!d) list.appendChild(el("p","empty","ニュースを読み込んでいます…"));
    else if (!shown.length && ts.length) {
      var box=el("div","empty"); box.appendChild(el("p",null,"「"+state.q.trim()+"」に一致するニュースは"+name+(state.filter==="all"?"":"の「"+state.filter+"」")+"にありません。"));
      var other = r==="national"?"kagoshima":"national", oname = other==="national"?"全国":"鹿児島県";
      var oc = d.regions[other].items.filter(function(n){ return matches(n, ts); }).length;
      if (oc) { var b=el("button","hint-btn",oname+"で"+oc+"件見つかりました。表示する"); b.type="button"; b.onclick=function(){ state.region=other; state.filter="all"; render(); }; box.appendChild(b); }
      else if (state.filter!=="all") { var b2=el("button","hint-btn","すべてのカテゴリで探す"); b2.type="button"; b2.onclick=function(){ state.filter="all"; render(); }; box.appendChild(b2); }
      list.appendChild(box);
    }
    else if (!shown.length) list.appendChild(el("p","empty", state.unreadOnly && inCat.length ? "未読のニュースはありません。すべて読みました。" : "このカテゴリの新着はまだありません。"));
    rest.forEach(function(n){
      var a=el("article","item"+(isRead(n)?" read":"")); var m=el("div","meta"); m.appendChild(tag(n.cat));
      if(isNew(n) && !isRead(n)) m.appendChild(el("span","new","NEW"));
      if(n.important) m.appendChild(el("span","chk","要チェック"));
      if(n.date) m.appendChild(el("span",null,fmtDate(n.date)));
      m.appendChild(el("span",null,n.source)); if(isRead(n)) m.appendChild(el("span","read-mark","既読")); a.appendChild(m);
      var h=el("h3"), lk=link("",n.link); lk.textContent=""; lk.appendChild(highlight(n.title, ts)); h.appendChild(lk); a.appendChild(h); list.appendChild(a);
    });

    var al = reg ? reg.alerts : [];
    var alist=$("alertList"); alist.textContent="";
    al.forEach(function(x){ var dv=el("div","alert-row"); dv.appendChild(link(x.title,x.link)); dv.appendChild(el("div","note",x.source+(x.date?" ・ "+fmtDate(x.date):""))); alist.appendChild(dv); });
    $("alerts").hidden = !al.length;

    var sl=$("sources"); sl.textContent="";
    (d ? d.sources : []).filter(function(s){ return s.region===r; }).forEach(function(s){
      var row=el("div","src-row"); row.appendChild(link(s.name,s.home));
      row.appendChild(el("span","n"+(s.ok?"":" err"), s.ok ? s.count+"件" : "取得できず"));
      sl.appendChild(row);
    });
  }

  function showStatus(t,err){ var s=$("status"); s.textContent=t; s.classList.toggle("err",!!err); }

  // If a newer version of this page has been published, reload once to pick it up
  // (phones keep an open page — especially one started from the home screen — for a long time).
  async function checkVersion(){
    try {
      var r = await fetch("index.html?v="+Date.now(), {cache:"no-store"}); if(!r.ok) return;
      var m = (await r.text()).match(/APP_VERSION = "([^"]+)"/);
      if (m && m[1] !== APP_VERSION) {
        var key="reloadedFor"; var done=null; try{ done=sessionStorage.getItem(key); }catch(e){}
        if (done !== m[1]) { try{ sessionStorage.setItem(key, m[1]); }catch(e){} location.reload(); }
      }
    } catch(e){}
  }
  async function load(){
    checkVersion();
    var res;
    try {
      res = await fetch("news.json?t="+Date.now(),{cache:"no-store"});
      if (!res.ok) throw new Error(res.status);
      state.data = await res.json(); render(); return true;
    } catch(e) { showStatus(res && res.status===404 ? "まだニュースがありません。最初の自動取得(最長15分)をお待ちください。" : "ニュースを読み込めませんでした。時間をおいてページを開き直してください。", true); return false; }
  }

  document.querySelectorAll(".seg button").forEach(function(b){
    b.onclick=function(){ state.region=b.dataset.region; state.filter="all"; try{localStorage.setItem("region",state.region);}catch(e){} render(); };
  });
  $("reloadBtn").onclick = async function(){
    var b=this; b.disabled=true; $("reloadIcon").classList.add("spin");
    await Promise.all([load(), new Promise(function(r){ setTimeout(r,500); })]);
    $("reloadIcon").classList.remove("spin"); b.disabled=false;
  };
  // Save the read mark immediately (the phone may pause this page as soon as the article opens),
  // then redraw; redraw again whenever the page comes back into view.
  function onOpen(e){
    var a=e.target.closest && e.target.closest("a[data-link]"); if(!a) return;
    var url=a.getAttribute("data-link"); if(!readMap[url]){ readMap[url]=Date.now(); saveRead(); }
    var item=a.closest(".item"); if(item){ item.classList.add("read"); var nb=item.querySelector(".new"); if(nb) nb.remove(); }
    setTimeout(render, 0);
  }
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) { render(); checkVersion(); } });
  window.addEventListener("pageshow", function(){ render(); });
  document.querySelector("main").addEventListener("click", onOpen);
  document.querySelector("main").addEventListener("auxclick", onOpen);
  $("unreadOnly").onclick=function(){ state.unreadOnly=!state.unreadOnly; render(); };
  $("markAll").onclick=function(){
    var d=state.data; if(!d) return;
    d.regions[state.region].items.filter(function(n){ return state.filter==="all" || n.cat===state.filter; })
      .forEach(function(n){ if(!readMap[n.link]) readMap[n.link]=Date.now(); });
    saveRead(); render();
  };
  // Swipe left/right on the news area to move between category tabs.
  (function(){
    var area=document.querySelector("main"), sx=0, sy=0, st=0, track=false;
    area.addEventListener("touchstart", function(e){
      if (e.touches.length!==1) { track=false; return; }
      var t=e.touches[0]; sx=t.clientX; sy=t.clientY; st=Date.now(); track=true;
    }, {passive:true});
    area.addEventListener("touchend", function(e){
      if (!track) return; track=false;
      var t=e.changedTouches[0], dx=t.clientX-sx, dy=t.clientY-sy;
      if (Date.now()-st>700 || Math.abs(dx)<60 || Math.abs(dx)<Math.abs(dy)*1.5) return;
      var cats=state.cats||["all"], i=cats.indexOf(state.filter), j=i+(dx<0?1:-1);
      if (j<0||j>=cats.length) return;
      state.filter=cats[j]; render();
      var col=document.querySelector(".col"); col.classList.remove("swipe-l","swipe-r"); void col.offsetWidth; col.classList.add(dx<0?"swipe-l":"swipe-r");
      var on=document.querySelector("#tabs button[aria-pressed=\"true\"]"); if(on&&on.scrollIntoView) on.scrollIntoView({block:"nearest",inline:"center"});
      var tabs=document.getElementById("tabs"), top=tabs.getBoundingClientRect().top;
      if (top<0) window.scrollBy({top:top-8});
    }, {passive:true});
  })();
  var qTimer=null;
  $("q").addEventListener("input", function(){ var v=this.value; clearTimeout(qTimer); qTimer=setTimeout(function(){ state.q=v; render(); }, 150); });
  $("q").addEventListener("keydown", function(e){ if(e.key==="Enter"){ this.blur(); } if(e.key==="Escape"){ this.value=""; state.q=""; render(); } });
  $("qClear").onclick=function(){ $("q").value=""; state.q=""; render(); $("q").focus(); };
  render(); load();
  setInterval(load, 5*60*1000);
})();
</script>
</body>
</html>
